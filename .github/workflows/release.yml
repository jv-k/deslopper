name: Release
on:
  push:
    tags: ["v*"]
  # Re-runs the release for an existing tag, once GitHub's 30-day re-run window has closed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.4.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q
      # --jev joins only when the secret is set; a fork PR has none and lints plainly.
      - run: deslopper lint --format github ${AI_GATEWAY_API_KEY:+--jev}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - name: Verify the tag matches the package version
        run: |
          tag="${TAG#v}"
          ver="$(python -c 'import deslopper; print(deslopper.__version__)')"
          test "$tag" = "$ver" || { echo "tag $tag != version $ver"; exit 1; }

  publish-pypi:
    # Off until the PyPI trusted publisher exists (RELEASING.md, One-time setup). Every
    # release from v1.5.0 to v1.7.0 failed here on the token exchange. Delete this `if`
    # to publish again.
    if: false
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A dispatched re-run must not fail on a version PyPI already holds.
          skip-existing: true

  # Independent of publish-pypi on purpose: a PyPI failure must not block the tap.
  # The formula points at an sdist attached to the GitHub release, not at the tag's
  # archive/refs/tags tarball. GitHub regenerates those archives, and their bytes drift:
  # the v1.8.0 and v2.0.0 checksums no longer matched their formulas within days.
  bump-homebrew-formula:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # VerBump creates the release just after it pushes the tag, so it can lag this job.
      - name: Wait for the GitHub release
        run: |
          for _ in $(seq 30); do
            gh release view "$TAG" >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "no GitHub release for $TAG after 5 minutes"; exit 1
      # An asset that is already up stays as it is, so a re-run never changes the bytes
      # that existing formulas name.
      - name: Attach the sdist to the release
        id: asset
        run: |
          name="deslopper-${TAG#v}.tar.gz"
          mkdir -p dist
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
            gh release download "$TAG" --pattern "$name" --dir dist
          else
            pip install build
            python -m build --sdist
            test -f "dist/$name"
            gh release upload "$TAG" "dist/$name"
          fi
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "dist/$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check the published asset matches
        env:
          URL: ${{ steps.asset.outputs.url }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: test "$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)" = "$SHA256"
      - uses: actions/checkout@v4
        with:
          repository: jv-k/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula and push
        working-directory: tap
        env:
          TARBALL_URL: ${{ steps.asset.outputs.url }}
          TARBALL_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          sed -i \
            -e "s|^  url \".*\"$|  url \"${TARBALL_URL}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${TARBALL_SHA256}\"|" \
            Formula/deslopper.rb
          grep -qF "url \"${TARBALL_URL}\"" Formula/deslopper.rb
          grep -qF "sha256 \"${TARBALL_SHA256}\"" Formula/deslopper.rb
          if git diff --quiet; then
            echo "Formula already at ${TAG}, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/deslopper.rb
          git commit -m "chore(formula): bump deslopper to ${TAG}"
          git push
