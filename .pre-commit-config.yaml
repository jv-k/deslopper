# Local hooks for deslopper contributors. Install with:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# Hooks run at the pre-commit stage only, unless they say otherwise below, so the
# suite is not run a second time when the commit-msg stage fires.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # The repo's own venv first, so a pytest elsewhere on PATH never tests a different
        # install. CI has no .venv and installs into the runner's Python instead.
        entry: bash -c 'p=.venv/bin/pytest; [ -x "$p" ] || p=pytest; "$p" -q'
        language: system
        pass_filenames: false
        always_run: true
      - id: deslopper
        name: deslopper (de-slop lint on Markdown)
        # Triage joins only when the committer's own shell holds the key, so a repo clone
        # never makes a network call on someone else's behalf.
        # The working tree's build, not a Homebrew or pipx install on PATH, which may be an
        # older release without the flags this repo now uses.
        entry: bash -c 'd=.venv/bin/deslopper; [ -x "$d" ] || d=deslopper; "$d" lint ${AI_GATEWAY_API_KEY:+--jev}'
        language: system
        types: [markdown]
        pass_filenames: false
